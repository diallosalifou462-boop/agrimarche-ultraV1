name: iOS Build & TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    env:
      XCODE_PROJECT: ios/App/App.xcodeproj
      XCODE_SCHEME: App
      BUNDLE_ID: com.agrimarche.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web (Capacitor)
        run: |
          set -e
          echo "###### Vérification : ce workflow vient bien de .github/workflows/ios.yml ######"
          npm run build:capacitor

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Check required secrets are set
        env:
          CERT_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APP_STORE_CONNECT_PROFILE }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -e
          missing=0
          for name in CERT_BASE64 CERT_PASSWORD PROFILE_BASE64 API_KEY_ID API_ISSUER_ID API_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "❌ Secret manquant ou vide : $name"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "→ Vérifie les noms des secrets dans Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "✅ Tous les secrets requis sont présents."

      # --- Code signing : certificat + profil de provisioning ---
      - name: Import code signing certificate & profile
        env:
          CERT_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APP_STORE_CONNECT_PROFILE }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          # Décoder le certificat et le profil depuis les secrets
          # (macOS utilise BSD base64 : -D pour décoder, -o pour la sortie —
          # la syntaxe GNU "--decode" n'est pas fiable ici)
          echo "$CERT_BASE64" | base64 -D -o "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE_BASE64" | base64 -D -o "$RUNNER_TEMP/profile.mobileprovision"

          # Créer un trousseau temporaire dédié à ce build
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          # Installer le profil de provisioning au bon endroit
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Debug - Afficher le contenu du profil installé
        run: |
          set -e
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          echo "Profil installé : $PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          echo "--- Name ---"
          /usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist"
          echo "--- UUID ---"
          /usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist"
          echo "--- Entitlements (doit contenir aps-environment) ---"
          /usr/libexec/PlistBuddy -c "Print :Entitlements" "$RUNNER_TEMP/profile.plist" || echo "⚠️ Pas d'entitlements trouvés"

      - name: Archive
        run: |
          set -e
          BUILD_NUMBER="${{ github.run_number }}"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=KAMMWG3VQH

      - name: Export IPA
        run: |
          set -e
          mkdir -p build/ios/ipa
          cat > "$RUNNER_TEMP/export_options.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>KAMMWG3VQH</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.agrimarche.app</key>
              <string>AgriMarche_AppStore_Profile</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/export_options.plist"

      - name: Zip dSYMs (diagnostic)
        run: |
          set -e
          mkdir -p build/ios/dsyms
          cp -R "$RUNNER_TEMP/App.xcarchive/dSYMs" build/ios/dsyms/ || echo "Aucun dossier dSYMs trouvé"
          cd build/ios/dsyms && zip -r ../dsyms.zip . && cd -

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/dsyms.zip
          retention-days: 30

      # --- Upload vers TestFlight ---
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -e
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 -D -o ~/private_keys/AuthKey_${API_KEY_ID}.p8

          # Vérification : le fichier décodé doit être une vraie clé privée PEM.
          # Si le secret APP_STORE_CONNECT_API_KEY a été mal encodé (texte brut au
          # lieu de base64, double encodage, etc.), ce check échoue ici avec un
          # message clair au lieu de laisser altool planter plus loin avec une
          # erreur JWT obscure.
          if ! head -1 ~/private_keys/AuthKey_${API_KEY_ID}.p8 | grep -q "BEGIN PRIVATE KEY"; then
            echo "❌ Le fichier .p8 décodé est invalide."
            echo "→ Vérifie que le secret APP_STORE_CONNECT_API_KEY contient bien le"
            echo "  résultat de : base64 -i AuthKey_XXXXXXXXXX.p8"
            echo "  et non le contenu brut du fichier .p8."
            exit 1
          fi
          echo "✅ Clé API valide"

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
