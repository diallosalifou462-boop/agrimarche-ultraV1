name: iOS Build & TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60

    env:
      XCODE_PROJECT: ios/App/App.xcodeproj
      XCODE_SCHEME: App
      BUNDLE_ID: com.agrimarche.app
      EXTENSION_BUNDLE_ID: com.agrimarche.app.NotificationServiceExtension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Read app version from package.json
        id: app_version
        run: |
          set -e
          # Source unique de vérité pour le numéro de version marketing :
          # le champ "version" de package.json. Plus besoin de toucher au
          # project.pbxproj à la main à chaque nouvelle soumission — on
          # bump juste la version dans package.json (ex: npm version patch).
          APP_VERSION=$(node -p "require('./package.json').version")
          if [ -z "$APP_VERSION" ]; then
            echo "❌ Impossible de lire la version depuis package.json"
            exit 1
          fi
          echo "✅ Version lue depuis package.json : $APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build web (Capacitor)
        env:
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
        run: |
          set -e
          echo "###### Vérification : ce workflow vient bien de .github/workflows/ios.yml ######"
          if [ -z "$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME" ] || [ -z "$NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET" ]; then
            echo "❌ Variables Cloudinary manquantes ou vides — le build continuerait avec un preset vide (401 garanti à l'upload)."
            exit 1
          fi
          echo "✅ Variables Cloudinary presentes (valeurs non affichees, ce sont des secrets)."
          npm run build:capacitor

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Debug - Vérifier la version Xcode active
        run: |
          set -e
          echo "Chemin actif : $(xcode-select -p)"
          xcodebuild -version
          echo "--- Runner OS ---"
          sw_vers

      - name: Check required secrets are set
        env:
          CERT_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APP_STORE_CONNECT_PROFILE }}
          EXT_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -e
          missing=0
          for name in CERT_BASE64 CERT_PASSWORD PROFILE_BASE64 EXT_PROFILE_BASE64 API_KEY_ID API_ISSUER_ID API_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "❌ Secret manquant ou vide : $name"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "→ Vérifie les noms des secrets dans Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "✅ Tous les secrets requis sont présents."

      # --- Code signing : certificat + profils de provisioning (app + extension) ---
      - name: Import code signing certificate & profiles
        env:
          CERT_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APP_STORE_CONNECT_PROFILE }}
          EXT_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$CERT_BASE64" | base64 -D -o "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE_BASE64" | base64 -D -o "$RUNNER_TEMP/profile.mobileprovision"
          echo "$EXT_PROFILE_BASE64" | base64 -D -o "$RUNNER_TEMP/profile_extension.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/
          cp "$RUNNER_TEMP/profile_extension.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Debug - Afficher le contenu des profils installés
        run: |
          set -e
          for f in "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile_extension.mobileprovision"; do
            echo "=== $f ==="
            security cms -D -i "$f" > "$RUNNER_TEMP/$(basename "$f").plist"
            echo "--- Name (à utiliser tel quel dans export_options.plist) ---"
            /usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/$(basename "$f").plist"
            echo "--- UUID ---"
            /usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/$(basename "$f").plist"
            echo "--- Application Identifier (doit matcher le bundle id du target) ---"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/$(basename "$f").plist" || echo "⚠️ Pas trouvé"
            echo ""
          done

      - name: Prepare Apple API key for code signing
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$API_KEY_BASE64" | base64 -D -o "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          if ! head -1 "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" | grep -q "BEGIN PRIVATE KEY"; then
            echo "❌ Clé API Apple invalide."
            exit 1
          fi

      - name: Configure Xcode signing profiles
        run: |
          set -e

          APP_PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          EXT_PROFILE="$RUNNER_TEMP/profile_extension.mobileprovision"
          PROJECT="ios/App/App.xcodeproj/project.pbxproj"

          # Read the REAL profile names and UUIDs from the profiles installed above.
          security cms -D -i "$APP_PROFILE" > "$RUNNER_TEMP/app_profile.plist"
          security cms -D -i "$EXT_PROFILE" > "$RUNNER_TEMP/ext_profile.plist"

          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/app_profile.plist")
          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/app_profile.plist")
          APP_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/app_profile.plist")

          EXT_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/ext_profile.plist")
          EXT_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/ext_profile.plist")
          EXT_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/ext_profile.plist")

          echo "===== REAL APP PROFILE ====="
          echo "Name : $APP_PROFILE_NAME"
          echo "UUID : $APP_PROFILE_UUID"
          echo "App ID : $APP_APP_ID"

          echo "===== REAL EXTENSION PROFILE ====="
          echo "Name : $EXT_PROFILE_NAME"
          echo "UUID : $EXT_PROFILE_UUID"
          echo "App ID : $EXT_APP_ID"

          case "$APP_APP_ID" in
            KAMMWG3VQH.com.agrimarche.app) ;;
            *) echo "❌ Le profil APP ne correspond pas à com.agrimarche.app"; exit 1 ;;
          esac

          case "$EXT_APP_ID" in
            KAMMWG3VQH.com.agrimarche.app.NotificationServiceExtension) ;;
            *) echo "❌ Le profil EXTENSION ne correspond pas à com.agrimarche.app.NotificationServiceExtension"; exit 1 ;;
          esac

          python3 - "$PROJECT" "$APP_PROFILE_UUID" "$EXT_PROFILE_UUID" <<'PY'
          from pathlib import Path
          import re
          import sys

          project = Path(sys.argv[1])
          app_uuid = sys.argv[2]
          ext_uuid = sys.argv[3]
          s = project.read_text()

          # Remove stale profile names that have caused the previous conflicts.
          s = s.replace("AgriMarche_AppStore_Profile", "")
          s = s.replace("AgriMarche_AppStore_Profil", "")

          def patch(config_id, values):
              global s
              m = re.search(re.escape(config_id) + r' /\* [^*]+ \*/ = \{.*?\n\s*\};', s, re.S)
              if not m:
                  raise RuntimeError(f"Configuration {config_id} not found")
              block = m.group(0)

              for key, value in values.items():
                  pat = re.compile(r'(?m)^(\s*)' + re.escape(key) + r'\s*=\s*[^;]+;')
                  repl = r'\1' + key + " = " + value + ";"
                  if pat.search(block):
                      block = pat.sub(repl, block, count=1)
                  else:
                      idx = block.find("buildSettings = {")
                      if idx < 0:
                          raise RuntimeError(f"buildSettings not found in {config_id}")
                      ins = idx + len("buildSettings = {")
                      block = block[:ins] + "\n\t\t\t\t" + key + " = " + value + ";" + block[ins:]

              s = s[:m.start()] + block + s[m.end():]

          # App Release: use the actual installed APP profile UUID.
          patch("504EC3181FED79650016851F", {
              "CODE_SIGN_STYLE": "Manual",
              "DEVELOPMENT_TEAM": "KAMMWG3VQH",
              "CODE_SIGN_IDENTITY": '"Apple Distribution"',
              "PROVISIONING_PROFILE_SPECIFIER": f'"{app_uuid}"',
          })

          # Extension configurations: use the actual installed extension profile UUID.
          for cid in ("9A2100000000000000000014", "9A2100000000000000000015"):
              patch(cid, {
                  "CODE_SIGN_STYLE": "Manual",
                  "DEVELOPMENT_TEAM": "KAMMWG3VQH",
                  "CODE_SIGN_IDENTITY": '"Apple Distribution"',
                  "PROVISIONING_PROFILE_SPECIFIER": f'"{ext_uuid}"',
              })

          project.write_text(s)
          PY

          echo "===== VERIFY PROJECT SIGNING SETTINGS ====="
          grep -n -A22 '504EC3181FED79650016851F /\* Release \*/' "$PROJECT"
          echo "===== VERIFY EXTENSION RELEASE SIGNING ====="
          grep -n -A22 '9A2100000000000000000015 /\* Release \*/' "$PROJECT"

          echo "===== VERIFY NO OLD PROFILE NAME REMAINS ====="
          if grep -n "AgriMarche_AppStore_Profile\|AgriMarche_AppStore_Profil" "$PROJECT"; then
            echo "❌ Ancien nom de profil encore présent dans project.pbxproj"
            exit 1
          fi

          echo "✅ Xcode configuré avec les UUID réels des profils installés."

      - name: Archive
        run: |
          set -e
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)

          echo "Build number : $BUILD_NUMBER"
          echo "Marketing version (depuis package.json) : $APP_VERSION"
          echo "🔐 Signature manuelle uniquement pour App et NotificationServiceExtension"

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$APP_VERSION"
      - name: Export IPA
        run: |
          set -e
          mkdir -p build/ios/ipa
          cat > "$RUNNER_TEMP/export_options.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>KAMMWG3VQH</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.agrimarche.app</key>
              <string>__APP_PROFILE_NAME__</string>
              <key>com.agrimarche.app.NotificationServiceExtension</key>
              <string>__EXT_PROFILE_NAME__</string>
            </dict>
          </dict>
          </plist>
          EOF

          # Use the actual names read from the installed provisioning profiles.
          /usr/bin/python3 - "$RUNNER_TEMP/export_options.plist" "$RUNNER_TEMP/app_profile.plist" "$RUNNER_TEMP/ext_profile.plist" <<'PY'
          from pathlib import Path
          import plistlib
          import sys

          out = Path(sys.argv[1])
          app_plist = plistlib.loads(Path(sys.argv[2]).read_bytes())
          ext_plist = plistlib.loads(Path(sys.argv[3]).read_bytes())

          data = plistlib.loads(out.read_bytes())
          profiles = data["provisioningProfiles"]
          profiles["com.agrimarche.app"] = app_plist["Name"]
          profiles["com.agrimarche.app.NotificationServiceExtension"] = ext_plist["Name"]
          out.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_XML, sort_keys=False))
          print("Export profile APP:", app_plist["Name"])
          print("Export profile EXT:", ext_plist["Name"])
          PY

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/export_options.plist"

      - name: Zip dSYMs (diagnostic)
        run: |
          set -e
          mkdir -p build/ios/dsyms
          cp -R "$RUNNER_TEMP/App.xcarchive/dSYMs" build/ios/dsyms/ || echo "Aucun dossier dSYMs trouvé"
          cd build/ios/dsyms && zip -r ../dsyms.zip . && cd -

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/dsyms.zip
          retention-days: 30

      # --- Upload vers TestFlight ---
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/private_keys"
          API_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"

          echo "$API_KEY_BASE64" | base64 -D -o "$API_KEY_PATH"

          if ! head -1 "$API_KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "❌ Le fichier .p8 décodé est invalide."
            echo "→ Vérifie que le secret APP_STORE_CONNECT_API_KEY contient bien"
            echo "  le résultat de : base64 -i AuthKey_XXXXXXXXXX.p8"
            exit 1
          fi

          echo "✅ Clé API valide"

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "❌ Aucun fichier IPA trouvé."
            exit 1
          fi

          echo "📦 IPA : $IPA_PATH"
          echo "🚀 Upload vers App Store Connect avec iTMSTransporter"

          xcrun iTMSTransporter             -m upload             -assetFile "$IPA_PATH"             -apiKey "$API_KEY_ID"             -apiIssuer "$API_ISSUER_ID"             -v informational
